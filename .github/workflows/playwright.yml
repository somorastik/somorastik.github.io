name: Playwright tests

# Runs the end-to-end suite in Chromium, Firefox, WebKit and a mobile viewport on every push and
# pull request to this branch. The HTML report is kept as a downloadable artifact for 14 days.
on:
  push:
    branches: [playwright-demo]
  pull_request:
    branches: [playwright-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browsers and the system libraries they need
        run: npx playwright install --with-deps
      - name: Run the tests
        run: npx playwright test
      - name: Keep the HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
