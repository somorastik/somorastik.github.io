<style>

    --stage: #0a0f1a; --board-frame: #3d2716; --board-tile: #d7c08e; --board-line: #7a5c30; --board-coord: #e9d6a9; --citadel: #b8955a;

  --stage: #0a0f1a; --board-frame: #3d2716; --board-tile: #d7c08e; --board-line: #7a5c30; --board-coord: #e9d6a9; --citadel: #b8955a;

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- header */
.topbar { position: relative; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar::after { content: ""; position: absolute; inset-inline: 0; bottom: -6px; height: 5px;
  background: linear-gradient(90deg, var(--lapis) 0 40%, var(--turq) 40% 70%, var(--gold) 70% 100%); background-size: 26px 5px; opacity: .85; }
.topbar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; margin-inline-end: auto; min-width: 0; }

.nav, .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.btn:hover:not(:disabled) { border-color: var(--lapis); }

.btn:disabled { opacity: .45; cursor: default; }

.link { border: 0; background: none; color: var(--lapis); text-decoration: underline; cursor: pointer; padding: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }

.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.icon-btn.flip { border: 1px solid var(--line); background: var(--surface); }
.zoom-label { min-width: 54px; height: 34px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted);
  font-variant-numeric: tabular-nums; cursor: pointer; }
.lang { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding-inline: 8px; background: var(--surface); }
.lang-glyph { font-size: 12px; color: var(--muted); }
.lang select { border: 0; background: transparent; padding: 7px 0; cursor: pointer; }

/* ---------- main */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.stage { position: relative; min-width: 0; min-height: 0; background: radial-gradient(ellipse at 50% 40%, var(--surface-2), var(--stage) 75%); }
.board2d, .board3d { position: absolute; inset: 0; }

.banner strong { font-family: var(--font-display); font-size: 20px; }

.toast { position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); z-index: 4; background: var(--fg); color: var(--bg);

.b-frame { fill: var(--board-frame); }
.b-sq { fill: var(--board-tile); stroke: var(--board-line); stroke-width: .03; cursor: pointer; }
.b-inlay { fill: none; stroke: var(--board-line); stroke-opacity: .28; stroke-width: .02; pointer-events: none; }
.b-cit { fill: var(--citadel); stroke: var(--board-line); stroke-width: .04; cursor: pointer; }
.b-tower { fill: var(--turq); pointer-events: none; }
.b-coord { font: 700 .25px var(--font-body); fill: var(--board-coord); pointer-events: none; }
.hl-last { fill: var(--hl-last); pointer-events: none; }
.hl-sel { fill: var(--hl-sel); pointer-events: none; }
.hl-check { fill: var(--hl-check); pointer-events: none; }
.hl-hint { fill: var(--hl-hint); pointer-events: none; }
.pieces use { pointer-events: none; }
.mk-dot { fill: var(--dot); pointer-events: none; }

.panel { min-height: 0; overflow: auto; background: var(--surface); border-inline-start: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 12px; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.card-title { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
html[dir="rtl"] .card-title { letter-spacing: 0; }
.muted { color: var(--muted); }
.status { background: var(--surface-2); }
.status p { margin: 6px 0 0; }
.turn { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.turn strong { font-size: 17px; }
.turn-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fg); }
.turn-dot.w { background: #f3ead6; }
.turn-dot.b { background: #2c3340; }
.status.over .status-title { display: block; font-family: var(--font-display); font-size: 22px; }

.status.over .btn { margin-top: 10px; }
.mode-line { font-size: 13px; }

.notice { color: var(--gold); font-weight: 500; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--gold); color: var(--on-accent); }
.badge.danger { background: var(--danger); }
.info-head { display: flex; gap: 12px; align-items: center; }

.info-names { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.info-names strong { font-size: 17px; }
.info-move { margin: 10px 0 0; }
.info p { margin: 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.captured .cap-row { min-height: 28px; display: flex; flex-wrap: wrap; gap: 2px; }
.cap-icon { width: 26px; height: 26px; }
.moves { flex: 1 0 auto; display: flex; flex-direction: column; min-height: 140px; }
.move-list { margin: 0; padding-inline-start: 26px; max-height: 280px; overflow: auto; font-size: 14px; font-variant-numeric: tabular-nums; }

.tutorial { display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }

.rule h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: 22px; text-wrap: balance; }
html[dir="rtl"] .rule h3 { font-family: var(--font-callig); font-size: 24px; }
.piece-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; margin-top: 14px; }
.piece-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.piece-card-head { display: flex; align-items: center; gap: 4px; }
.piece-card-head svg { background: var(--board-tile); border-radius: 8px; }
.piece-card-names { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-inline-start: 8px; }
.piece-card-names strong { font-size: 17px; }
.piece-move { margin: 0; flex: 1; }
.diagram-wrap { direction: ltr; }
.diagram { width: 100%; max-width: 260px; display: block; }
.d-frame { fill: var(--board-frame); }
.d-sq { fill: var(--board-tile); stroke: var(--board-line); stroke-width: .03; }
.d-reach { fill: color-mix(in srgb, var(--turq) 22%, var(--board-tile)); }
.d-home { fill: color-mix(in srgb, var(--gold) 45%, var(--board-tile)); }
.d-dot { fill: #22408d; }
.d-cross { stroke: #b3261e; stroke-width: .12; stroke-linecap: round; }

/* ---------- phones and small tablets */
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; min-height: 100%; }
  .main { display: flex; flex-direction: column; }
  .stage { height: min(78vw, 72svh); min-height: 300px; }
  .panel { border-inline-start: 0; border-top: 1px solid var(--line); overflow: visible; }

  .move-list { max-height: 220px; }
}

et\xED. Vznikly ze \u0161atrand\u017Ee, p\u0159edch\u016Fdce dne\u0161n\xEDch \u0161ach\u016F, a na v\u011Bt\u0161\xED \u0161achovnici p\u0159id\xE1vaj\xED nov\xE9 figury.\n\nTato aplikace hraje \u201E\xDApln\xE9 Velk\xE9 \u0161achy\u201C, postaven\xED zapsan\xE9 v rukopisu 7322 Britsk\xE9ho muzea, kde pr\xE1zdn\xE1 pole zadn\xED \u0159ady zapln\xED lev, b\xFDk, odhalova\u010D a mo\u0159sk\xE1 obluda. C\xEDlem je d\xE1t soupe\u0159ovu kr\xE1li mat nebo pat.'), to('r2h', '\u0160achovnice'), to('r2', '\u0160achovnice m\xE1 11 sloupc\u016F (a a\u017E k) a 10 \u0159ad, celkem 110 pol\xED, tradi\u010Dn\u011B jedn\xE9 barvy. Ze stran vy\u010Dn\xEDvaj\xED dv\u011B pole nav\xEDc: citadela b\xEDl\xE9ho vedle k2 a citadela \u010Dern\xE9ho vedle a9. B\xEDl\xFD za\u010D\xEDn\xE1 dole.'), to('r3h', 'Figury'), to('r3', 'Ka\u017Ed\xE1 strana m\xE1 22 figur a 14 p\u011B\u0161c\u016F. Sk\xE1kaj\xEDc\xED figury p\u0159esko\u010D\xED v\u0161e, co jim stoj\xED v cest\u011B; ostatn\xED pot\u0159ebuj\xED volnou dr\xE1hu. Diagramy ukazuj\xED, kam m\u016F\u017Ee figura z pole f5 t\xE1hnout na pr\xE1zdn\xE9 \u0161achovnici.'), to('r4h', 'P\u011B\u0161ci a prom\u011Bna'), to('r4', 'Ka\u017Ed\xFD p\u011B\u0161ec pat\u0159\xED k n\u011Bjak\xE9 figu\u0159e: je p\u011B\u0161ec v\u011B\u017E\xED, p\u011B\u0161ec velbloud\u016F, p\u011B\u0161ec \u017Eiraf atd. P\u011B\u0161ec t\xE1hne o jedno pole dop\u0159edu a bere o jedno pole \u0161ikmo dop\u0159edu. Nem\xE1 \xFAvodn\xED dvojkrok ani bran\xED mimochodem.\n\nKdy\u017E p\u011B\u0161ec dos\xE1hne posledn\xED \u0159ady, prom\u011Bn\xED se ve figuru, ke kter\xE9 pat\u0159\xED. P\u011B\u0161ec kr\xE1l\u016F se m\u011Bn\xED v prince, dal\u0161\xED kr\xE1lovskou figuru, kter\xE1 t\xE1hne jako kr\xE1l.'), to('r5h', 'P\u011B\u0161ec p\u011B\u0161c\u016F'), to('r5', 'Kdy\u017E p\u011B\u0161ec p\u011B\u0161c\u016F poprv\xE9 dos\xE1hne posledn\xED \u0159ady, z\u016Fstane tam a nelze ho sebrat. Jakmile vznikne pole, ze kter\xE9ho by napadl dv\u011B soupe\u0159ovy figury najednou, mus\xED na n\u011Bj sko\u010Dit. Figura, kter\xE1 na tom poli stoj\xED, vlastn\xED \u010Di soupe\u0159ova, se odstran\xED (nikdy ne kr\xE1lovsk\xE1). Pak pokra\u010Duje jako p\u011B\u0161ec.\n\nPodruh\xE9 se p\u0159esune na v\xFDchoz\xED pole p\u011B\u0161ce kr\xE1l\u016F (f3 nebo f8). Pot\u0159et\xED se z n\u011Bj stane n\xE1hradn\xED kr\xE1l.'), to('r6h', 'Kr\xE1lovsk\xE9 figury'), to('r6', 'Kr\xE1l, princ a n\xE1hradn\xED kr\xE1l jsou kr\xE1lovsk\xE9 figury, v tomto po\u0159ad\xED hodnosti. Dokud m\xE1 strana dv\u011B \u010Di v\xEDce kr\xE1lovsk\xFDch figur, berou se jako kter\xE9koli jin\xE9 figury a strana sm\xED dokonce vstoupit do \u0161achu. Kdy\u017E j\xED zbude jedin\xE1 kr\xE1lovsk\xE1 figura, plat\xED pro ni b\u011B\u017En\xE1 pravidla \u0161achu.'), to('r7h', '\u0160ach, mat a pat'), to('r7', 'Napaden\xE1 kr\xE1lovsk\xE1 figura je v \u0161achu a jej\xED hr\xE1\u010D ji mus\xED ze \u0161achu dostat. Pokud to nejde, je to mat a hra je prohran\xE1.\n\nNa rozd\xEDl od dne\u0161n\xEDch \u0161ach\u016F je v\xFDhrou i pat: hr\xE1\u010D, kter\xFD nem\xE1 \u017E\xE1dn\xFD platn\xFD tah, prohr\xE1v\xE1. Sebrat v\u0161echny figury krom\u011B kr\xE1le nesta\u010D\xED, proto\u017Ee osam\u011Bl\xFD kr\xE1l m\u016F\u017Ee je\u0161t\u011B ut\xE9ct do citadely.'), to('r8h', 'V\xFDm\u011Bna kr\xE1le'), to('r8', 'Jednou za hru, kdy\u017E je kr\xE1l v \u0161achu nebo jeho strana nem\xE1 platn\xFD tah, si kr\xE1l m\u016F\u017Ee vym\u011Bnit m\xEDsto s kteroukoli vlastn\xED figurou, pokud bude potom v bezpe\u010D\xED.'), to('r9h', 'Citadely'), to('r9', 'Pokud nejvy\u0161\u0161\xED kr\xE1lovsk\xE1 figura strany vstoup\xED do soupe\u0159ovy citadely, hra kon\u010D\xED rem\xEDzou. Je to \xFAnikov\xE1 cesta prohr\xE1vaj\xEDc\xED strany. M\xEDsto rem\xEDzy m\u016F\u017Ee kr\xE1l, kter\xFD m\xE1 prince nebo n\xE1hradn\xEDho kr\xE1le, jednou za hru vstoupit do citadely a vym\u011Bnit si m\xEDsto s touto figurou, kter\xE1 pak z\u016Fstane v citadele.\n\nDo vl
